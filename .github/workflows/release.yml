name: Release

# Alur: PR dengan changeset di-merge ke main → action membuka PR "Version Packages"
# (menaikkan versi + menulis CHANGELOG) → PR itu di-merge → action mem-publish ke npm,
# membuat git tag `@nemo-ui/ui@x.y.z`, dan GitHub Release.
on:
  push:
    branches: [main]

# Jangan pernah membatalkan publish yang sedang berjalan.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push commit versi + git tag
      pull-requests: write # buka/update PR "Version Packages"
      id-token: write # provenance attestation (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          # Perlu riwayat penuh agar action bisa mendeteksi tag & commit versi.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Menulis .npmrc dengan NODE_AUTH_TOKEN saat step publish.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Publish memakai trusted publishing (OIDC), tanpa NPM_TOKEN.
      # Butuh npm >= 11.5.1 sedangkan Node 22 di runner membawa npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      # `pnpm release` = `changeset publish`; `prepublishOnly` di packages/ui
      # menjalankan build + test sebelum tarball diunggah.
      - uses: changesets/action@v1
        id: changeset
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tanpa NODE_AUTH_TOKEN: npm memakai identitas OIDC dari
          # trusted publisher yang didaftarkan di halaman pengaturan paket.
          # Provenance ikut terkirim otomatis saat memakai OIDC.
          NPM_CONFIG_PROVENANCE: "true"

      # Publish bisa dilaporkan sukses walau registry belum menyajikan versinya
      # (propagasi CDN). Polling ini memastikan rilis benar-benar bisa di-install.
      - name: Verify published versions on npm
        if: steps.changeset.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changeset.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          specs=$(node -e 'JSON.parse(process.env.PUBLISHED_PACKAGES).forEach((p) => console.log(`${p.name}@${p.version}`))')
          for spec in $specs; do
            for attempt in $(seq 1 10); do
              if npm view "$spec" version >/dev/null 2>&1; then
                echo "$spec tersedia di registry"
                break
              fi
              if [ "$attempt" -eq 10 ]; then
                echo "::error::$spec tidak ditemukan di registry setelah 10 percobaan"
                exit 1
              fi
              echo "Menunggu $spec (percobaan $attempt/10)..."
              sleep 6
            done
          done
