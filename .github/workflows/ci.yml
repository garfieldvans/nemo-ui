name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `changeset status --since` membandingkan dengan base branch, jadi
          # butuh riwayat penuh (default checkout hanya 1 commit).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      # Build UI dulu: typecheck & build playground membaca tipe dari dist paket.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test:run

      # Token adalah source of truth; themes.scss yang tidak di-generate ulang
      # berarti CSS statis dan ThemeProvider bisa menampilkan warna berbeda.
      - run: pnpm tokens:check

      # Perubahan pada paket publik wajib punya catatan rilis. PR yang hanya
      # menyentuh docs/playground tidak dipaksa membuat changeset.
      - name: Require a changeset for @nemo/ui changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- packages/ui/src; then
            echo "Tidak ada perubahan di packages/ui/src — changeset tidak wajib."
            exit 0
          fi
          pnpm exec changeset status --since="origin/${{ github.base_ref }}"
